name: Editor Extension (VS Code & Cursor)

on:
  pull_request:
    paths:
      - "extensions/**"
      - ".github/workflows/extension.yml"
  push:
    tags:
      - "ext-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (package and test only, skip publishing even if secrets exist)"
        type: boolean
        default: false

jobs:
  build-and-test:
    name: Build, Test & Package VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Git Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/ext-v')
        run: |
          python -c "
          import json, os, sys
          with open('extensions/vscode/package.json', 'r', encoding='utf-8') as f:
              pkg = json.load(f)
          ref = os.environ.get('GITHUB_REF_NAME', '')
          expected = f'ext-v{pkg[\"version\"]}'
          if ref != expected:
              sys.exit(f'FATAL: Tag mismatch! Git tag is \"{ref}\" but package.json version is \"{pkg[\"version\"]}\" (expected \"{expected}\"). Aborting release.')
          print(f'OK: Tag {ref} matches package.json version {pkg[\"version\"]}')
          "

      - name: Install gitpr-cli (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm install

      - name: Compile and run tests
        working-directory: extensions/vscode
        run: npm test

      - name: Package VSIX
        working-directory: extensions/vscode
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitpr-vscode-vsix
          path: extensions/vscode/*.vsix

  github-release:
    name: Create GitHub Release with VSIX
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/ext-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: gitpr-vscode-vsix
          path: extensions/vscode

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GitPR Extension ${{ github.ref_name }}
          files: extensions/vscode/*.vsix
          generate_release_notes: true

  publish-marketplaces:
    name: Publish to Marketplaces (Granular)
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/ext-v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: gitpr-vscode-vsix
          path: extensions/vscode

      - name: Publish to VS Code Marketplace
        working-directory: extensions/vscode
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "Publishing to Visual Studio Marketplace..."
            npx @vscode/vsce publish --packagePath *.vsix -p "$VSCE_PAT"
            echo "VSCE_STATUS=published" >> $GITHUB_ENV
          else
            echo "::notice::VSCE_PAT is not configured in repository secrets. Skipping VS Code Marketplace publication."
            echo "VSCE_STATUS=skipped" >> $GITHUB_ENV
          fi

      - name: Publish to Open VSX (Cursor)
        working-directory: extensions/vscode
        run: |
          if [ -n "$OVSX_PAT" ]; then
            echo "Publishing to Open VSX Registry..."
            npx ovsx publish *.vsix -p "$OVSX_PAT"
            echo "OVSX_STATUS=published" >> $GITHUB_ENV
          else
            echo "::notice::OVSX_PAT is not configured in repository secrets. Skipping Open VSX publication."
            echo "OVSX_STATUS=skipped" >> $GITHUB_ENV
          fi

      - name: Report Marketplace Summary
        run: |
          echo "### 🧩 Extension Marketplace Publication Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Marketplace | Target IDEs | Status | Notes |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          if [ "$VSCE_STATUS" = "published" ]; then
            echo "| Visual Studio Marketplace | VS Code | ✅ Published | Available at marketplace.visualstudio.com |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Visual Studio Marketplace | VS Code | ⚠️ Skipped | Secret VSCE_PAT not configured |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$OVSX_STATUS" = "published" ]; then
            echo "| Open VSX Registry | Cursor, VSCodium | ✅ Published | Available at open-vsx.org |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Open VSX Registry | Cursor, VSCodium | ⚠️ Skipped | Secret OVSX_PAT not configured |" >> $GITHUB_STEP_SUMMARY
          fi
