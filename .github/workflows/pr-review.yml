name: GitPR Review

on:
  pull_request:
    branches: [ main, master ]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Required for GitPR to be able to read origin/main

      - name: GitPR AI Review
        uses: natanfiuza/gitpr@main
        with:
          provider: 'gemini'
          api-key: ${{ secrets.GEMINI_API_KEY }}