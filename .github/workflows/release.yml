name: Release (PyPI & GitHub Release)

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Create GitPR profile
        run: mkdir -p ~/.gitpr && touch ~/.gitpr/.env

      - name: Run Pytest
        run: python -m pytest tests/ -q

  build:
    name: Build Package & Verify
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Git Tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -c "
          import os, sys
          from src.updater import __version__
          ref = os.environ.get('GITHUB_REF_NAME', '')
          expected = f'v{__version__}'
          if ref != expected:
              sys.exit(f'FATAL: Tag mismatch! Git tag is \"{ref}\" but src.updater.__version__ is \"{expected}\". Aborting release.')
          print(f'OK: Tag {ref} matches code version {__version__}')
          "

      - name: Install Build Tools
        run: python -m pip install --upgrade pip build twine

      - name: Build Distribution Packages (sdist and wheel)
        run: python -m build

      - name: Check Distribution Metadata with Twine
        run: twine check --strict dist/*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 5

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gitpr-cli
    permissions:
      id-token: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
