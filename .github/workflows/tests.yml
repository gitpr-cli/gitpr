name: Tests

on:
  push:
    branches: [ main, develop_natan ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor (pyproject requires-python) and the version the
        # project is developed on (Pipfile). 3.10 has never been exercised.
        python-version: [ "3.10", "3.13" ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e . && pip install pytest

      # A fresh runner has no ~/.gitpr. GitPR creates that profile on first use,
      # and tests/demo/test_demo_isolation.py asserts it exists — it snapshots
      # the profile to prove the tour writes nothing into it.
      - name: Create the GitPR profile
        run: mkdir -p ~/.gitpr && touch ~/.gitpr/.env

      - name: Run the test suite
        run: python -m pytest tests/ -q
