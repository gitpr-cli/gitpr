[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpr-cli"
dynamic = ["version"]
description = "AI-powered PR automation, commit messages, and code review (Gemini, DeepSeek, and Ollama)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Natan Fiuza", email = "contato@natanfiuza.dev.br"}
]
dependencies = [
    "click>=8.0.0",
    "google-genai",
    "openai",
    "python-dotenv",
    "cryptography",
    "pyyaml",
    "textual",
    "requests",
    "mcp>=1.0.0",
    "packaging>=23.0"
]

[project.scripts]
gitpr = "src.main:cli"
gitpr-mcp = "src.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

# The bundled policy packs are data, not code: the four directories under
# src/policy_packs ship inside the wheel, and without this block a built package
# would find no packs at all while the source tree found four. MANIFEST.in is
# not used anywhere in this project, so there is one place to look.
[tool.setuptools.package-data]
"src.policy_packs" = ["**/*.yml", "**/*.yaml", "**/*.md"]

[tool.setuptools.dynamic]
version = {attr = "src.updater.__version__"}

[tool.pyright]
include = ["src"]
executionEnvironments = [
  { root = "." }
]