# ==============================================================================
# 🛡️ GitPR - Configuración del Linter Estático Local
# ==============================================================================
# Este archivo define las reglas de calidad que se ejecutan en la máquina del desarrollador.
# GitPR analiza solo las LÍNEAS MODIFICADAS en el 'git diff'.
#
# Propiedades de la Regla:
# - name: Identificador único de la regla (sin espacios).
# - level: 'error' (bloquea el commit) o 'warning' (solo muestra una alerta amarilla).
# - extensions: Lista de extensiones de archivo donde la regla actúa (ej: ["php", "js"]).
# - require_paths: (Opcional) Limita la ejecución a carpetas específicas (ej: ["routes/*"]).
# - ignore_paths: (Opcional) Ignora carpetas específicas (ej: ["vendor/*", "tests/*"]).
# - regex: La expresión regular de búsqueda (USA SIEMPRE comillas simples '').
# - message: El texto de la alerta. Acepta las variables {file_name} y {line_number}.
# - ignore_comments: true (ignora código comentado) / false (lee los comentarios).
# ==============================================================================

rules:
  # ---------------------------------------------------------
  # 🚨 ERRORES CRÍTICOS (Bloquean el Commit)
  # ---------------------------------------------------------

  - name: "check-php-debug"
    level: "error"
    extensions: ["php"]
    regex: '\b(dd|dump|var_dump|print_r|die|exit)\s*\('
    message: "🚨 Código de depuración olvidado en el archivo {file_name} (Línea {line_number}). Elimínalo antes de enviar."
    ignore_comments: true

  - name: "check-js-console"
    level: "error"
    extensions: ["js", "ts", "vue", "jsx", "tsx"]
    regex: 'console\.(log|debug|info)\s*\('
    message: "🚨 Uso de console.log no permitido en producción. Encontrado en {file_name} (Línea {line_number})."
    ignore_comments: true

  - name: "check-localhost"
    level: "error"
    extensions: ["php", "js", "ts", "vue", "env", "yaml", "yml"]
    regex: '(localhost|127\.0\.0\.1)'
    message: "🚨 URL o IP local (localhost/127.0.0.1) hardcoded en {file_name} (Línea {line_number}). Utiliza variables de entorno."
    ignore_comments: true

  - name: "check-route-verbs"
    level: "error"
    extensions: ["php"]
    require_paths:
      - "routes/*"
    regex: 'Route::[a-zA-Z]+\s*\(\s*[''"](get|get-|busca|buscar|procura|procurar|pesquisa|pesquisar|lista|listar|cria|criar|atualiza|atualizar|deleta|deletar)'
    message: "🚨 URI inadecuada en {file_name} (Línea {line_number}). Evita usar verbos en la URL de la ruta. Sigue el estándar RESTful (ej: GET /usuarios)."
    ignore_comments: true

  # ---------------------------------------------------------
  # ⚠️ AVISOS DE BUENAS PRÁCTICAS (No bloquean el Commit)
  # ---------------------------------------------------------

  - name: "warning-docblock-php"
    level: "warning"
    extensions: ["php"]
    regex: '\b(public|protected|private)?\s*function\s+\w+\s*\('
    message: "👀 Recordatorio: Creaste/modificaste la función en la línea {line_number} de {file_name}. ¿Verificaste que el DocBlock esté actualizado?"
    ignore_comments: true

  - name: "warning-todo-fixme"
    level: "warning"
    extensions: ["php", "js", "ts", "vue", "py"]
    regex: '(?i)(TODO|FIXME):'
    message: "⚠️ Atención: Existe una anotación TODO o FIXME pendiente en {file_name} (Línea {line_number})."
    ignore_comments: false # ¡Aquí necesitamos leer los comentarios a propósito!
