# ==============================================================================
# 🛡️ GitPR - Local Static Linter Configuration
# ==============================================================================
# This file defines the quality rules that run on the developer's machine.
# GitPR analyzes only the MODIFIED LINES in 'git diff'.
#
# Rule Properties:
# - name: Unique rule identifier (no spaces).
# - level: 'error' (blocks the commit) or 'warning' (only displays yellow alert).
# - extensions: List of file extensions where the rule applies (e.g.: ["php", "js"]).
# - require_paths: (Optional) Limits execution to specific folders (e.g.: ["routes/*"]).
# - ignore_paths: (Optional) Ignores specific folders (e.g.: ["vendor/*", "tests/*"]).
# - regex: The search regular expression (ALWAYS use single quotes '').
# - message: The alert text. Accepts variables {file_name} and {line_number}.
# - ignore_comments: true (ignores commented code) / false (reads comments).
# ==============================================================================

rules:
  # ---------------------------------------------------------
  # 🚨 CRITICAL ERRORS (Block the Commit)
  # ---------------------------------------------------------

  - name: "check-php-debug"
    level: "error"
    extensions: ["php"]
    regex: '\b(dd|dump|var_dump|print_r|die|exit)\s*\('
    message: "🚨 Debug code left behind in file {file_name} (Line {line_number}). Remove before pushing."
    ignore_comments: true

  - name: "check-js-console"
    level: "error"
    extensions: ["js", "ts", "vue", "jsx", "tsx"]
    regex: 'console\.(log|debug|info)\s*\('
    message: "🚨 console.log usage not allowed in production. Found in {file_name} (Line {line_number})."
    ignore_comments: true

  - name: "check-localhost"
    level: "error"
    extensions: ["php", "js", "ts", "vue", "env", "yaml", "yml"]
    regex: '(localhost|127\.0\.0\.1)'
    message: "🚨 Hardcoded URL or local IP (localhost/127.0.0.1) in {file_name} (Line {line_number}). Use environment variables."
    ignore_comments: true

  - name: "check-route-verbs"
    level: "error"
    extensions: ["php"]
    require_paths:
      - "routes/*"
    regex: 'Route::[a-zA-Z]+\s*\(\s*[''"](get|get-|busca|buscar|procura|procurar|pesquisa|pesquisar|lista|listar|cria|criar|atualiza|atualizar|deleta|deletar)'
    message: "🚨 Inappropriate URI in {file_name} (Line {line_number}). Avoid using verbs in the route URL. Follow RESTful standards (e.g.: GET /users)."
    ignore_comments: true

  # ---------------------------------------------------------
  # ⚠️ BEST PRACTICE WARNINGS (Do Not Block the Commit)
  # ---------------------------------------------------------

  - name: "warning-docblock-php"
    level: "warning"
    extensions: ["php"]
    regex: '\b(public|protected|private)?\s*function\s+\w+\s*\('
    message: "👀 Reminder: You created/modified the function at line {line_number} of {file_name}. Did you make sure the DocBlock is up to date?"
    ignore_comments: true

  - name: "warning-todo-fixme"
    level: "warning"
    extensions: ["php", "js", "ts", "vue", "py"]
    regex: '(?i)(TODO|FIXME):'
    message: "⚠️ Attention: There is a pending TODO or FIXME annotation in {file_name} (Line {line_number})."
    ignore_comments: false # We intentionally need to read comments here!
